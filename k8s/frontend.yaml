apiVersion: apps/v1
kind: Deployment
metadata:
  name: pipelineshield-frontend
  namespace: pipelineshield
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pipelineshield-frontend
  template:
    metadata:
      labels:
        app: pipelineshield-frontend
    spec:
      containers:
        - name: frontend
          image: pipelineshield-frontend:local
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: pipelineshield-frontend
  namespace: pipelineshield
spec:
  selector:
    app: pipelineshield-frontend
  ports:
    - port: 80
      targetPort: 80
