[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "pipelineshield-api"
version = "0.1.0"
description = "PipelineShield – CI/CD pipeline security analysis service"
requires-python = ">=3.12"

dependencies = [
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.1.18",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "cryptography>=42.0.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.27.0",
    "PyJWT[crypto]>=2.8.0",
    "redis>=5.0.0",
    "ruamel.yaml>=0.18.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "testcontainers[postgres]>=4.4.0",
    "mypy>=1.9.0",
    "sqlalchemy[mypy]>=2.0.30",
    "hypothesis>=6.100.0",
    "fakeredis>=2.23.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pipelineshield = [
    "catalogue/data/*.json"
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["sqlalchemy.ext.mypy.plugin"]
exclude = ["alembic/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error"]
markers = [
    "benchmark: seeded corpus detection benchmark (excluded from default fast run)",
]
addopts = "-m 'not benchmark'"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "alembic/*"]
