# Fixture: Hardened minimal GitHub Actions workflow
# No seeded gaps for: lp-001, sci-001, expression-injection, pwn-request

name: hardened-minimal-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run tests
        run: npm test

      - name: Secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b3246a1b330e87fa9b0f82 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: SAST
        uses: returntocorp/semgrep-action@fcd5ab7459e8d91cb1777481980d1b18b4fc6735 # v1

      - name: Dependency scan
        run: npm audit --audit-level=high
