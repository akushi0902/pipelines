    format: github_actions
    line_count: 50
    not_assessable: []
    negative_expectations: []
    seeded_gaps:
      - control_id: sh-001
        category: secrets_hygiene
        severity: critical
        expected_status: missing
        expected_anchor_line: 35
        rationale: "Synthetic GitHub PAT placeholder committed to workflow file in docker login --password argument"
      - control_id: lp-001
        category: least_privilege
        severity: high
        expected_status: missing
        expected_anchor_line: 7
