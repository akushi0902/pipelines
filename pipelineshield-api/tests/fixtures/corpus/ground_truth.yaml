files:
  # ---------------------------------------------------------------------------
  # GitHub Actions — hardened (all 9 control categories present)
  # ---------------------------------------------------------------------------
  - path: "github_actions/github_actions_node_service_hardened.yml"
    format: github_actions
    line_count: 100
    seeded_gaps: []
    not_assessable: []
    negative_expectations:
      - {control_id: sh-001, category: secrets_hygiene, rationale: "No hardcoded credentials; all values injected via secrets context"}
      - {control_id: sh-002, category: secrets_hygiene, rationale: "gitleaks-action present and exit-code enforced"}
      - {control_id: sa-001, category: static_analysis, rationale: "semgrep-action with owasp-top-ten and nodejs rulesets"}
      - {control_id: ds-001, category: dependency_scanning, rationale: "npm audit with audit-level=high enforced"}
      - {control_id: ds-002, category: dependency_scanning, rationale: "trivy-action scans built image with CRITICAL,HIGH fail"}
      - {control_id: lp-001, category: least_privilege, rationale: "permissions block: contents=read, id-token=write only"}
      - {control_id: lp-002, category: least_privilege, rationale: "No write-all permissions; no wildcard write grants"}
      - {control_id: iac-001, category: iac_misconfiguration, rationale: "checkov-action runs on infra/ directory"}
      - {control_id: sci-001, category: supply_chain_integrity, rationale: "All third-party actions pinned to full commit SHA"}
      - {control_id: sbom-001, category: sbom, rationale: "anchore/sbom-action generates spdx-json SBOM"}
      - {control_id: as-001, category: artifact_signing, rationale: "cosign signs image with keyless OIDC"}
      - {control_id: as-002, category: artifact_signing, rationale: "slsa-github-generator produces SLSA level 3 provenance"}
      - {control_id: ag-001, category: approval_gates, rationale: "production environment with required-reviewers gate"}

