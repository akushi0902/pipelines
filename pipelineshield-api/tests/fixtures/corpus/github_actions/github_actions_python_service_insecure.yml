# Synthetic insecure variant: Python service
# Seeded gaps: sa-001 (no SAST), ds-001 (no dependency scan), ag-001 (no approval gate),
#              sci-002 (pull_request_target with fork checkout — pwn-request pattern)
# All credential-like values are SYNTHETIC PLACEHOLDERS.

name: python-service-insecure-ci

on:
  push:
    branches: [main]
  # GAP sci-002: pull_request_target triggers on fork PR with direct checkout
  pull_request_target:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # GAP sci-002: checking out PR head code under pull_request_target is a pwn-request
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-python@42375524bfc5dba77e569dfe3958aa0f7a25e52c # v5.4.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # GAP sa-001: no semgrep or bandit SAST step
      # GAP ds-001: no pip-audit or safety dependency scan step

      - name: Run tests
        run: pytest

  deploy:
    needs: test
    runs-on: ubuntu-latest
    # GAP ag-001: deploys directly without an environment requiring approval
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Deploy to production
        run: ./scripts/deploy.sh production
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
