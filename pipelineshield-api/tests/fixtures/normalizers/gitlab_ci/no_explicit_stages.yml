# No stages: key — GitLab default stages should be inferred:
# .pre, build, test, deploy, .post

default:
  image: python:3.11

lint:
  stage: test
  script:
    - pip install flake8
    - flake8 .

unit-tests:
  stage: test
  script:
    - pip install pytest
    - pytest tests/

deploy:
  stage: deploy
  script:
    - ./deploy.sh
  only:
    - main
