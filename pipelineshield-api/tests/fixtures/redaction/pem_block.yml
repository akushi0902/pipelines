    -----BEGIN RSA PRIVATE KEY-----
    MIIEowIBAAKCAQEAFAKEKEYDATAHEREABCDEFGHIJKLMNOPQRSTUVWXYZ012345
    ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789AB
