[alembic]
# Path to migration scripts
script_location = alembic

# Template used to generate migration filenames
file_template = %%(rev)s_%%(slug)s

# Timezone to use when rendering the date within the migration file
# Leave blank for UTC, or use a standard timezone abbreviation
timezone = UTC

# Max length of characters to apply to the "slug" field
# truncate_slug_length = 40

# Set to 'true' to run the environment during the 'revision' command,
# regardless of autogenerate
# revision_environment = false

# Set to 'true' to allow .pyc and .pyo files without
# a source .py file to be detected as revisions in the
# versions/ directory
# sourceless = false

# Version location specification; This defaults to alembic/versions.
# When using multiple version directories, initial revisions must
# be specified with --version-path.
# The path separator used here should be the separator specified by
# "version_path_separator" option below.
# version_locations = %(here)s/bar:%(here)s/bat:alembic/versions

# Version path separator
# version_path_separator = os  # Use os.pathsep.
# version_path_separator = space
# version_path_separator = newline
# version_path_separator = :

# The output encoding used when revision files
# are written from script.py.mako
# output_encoding = utf-8

# The database URL is injected at runtime from DATABASE_URL environment variable.
# Never hardcode credentials here.
sqlalchemy.url = ${DATABASE_URL}

[post_write_hooks]
# Hooks to run after revision creation; see
# https://alembic.sqlalchemy.org/en/latest/api/runtime.html#alembic.runtime.migration.MigrationContext.configure

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
