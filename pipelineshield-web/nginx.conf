server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the backend service inside the cluster.
    # Using the internal k8s service name (not a public URL) means
    # this works no matter what the public tunnel URL is that run,
    # so no rebuild is needed when the tunnel URL changes.
    location /api/ {
        proxy_pass http://pipelineshield-backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy the OpenAPI schema too, in case the frontend fetches it directly.
    location /openapi.json {
        proxy_pass http://pipelineshield-backend:8000/openapi.json;
        proxy_set_header Host $host;
    }

    # Serve the built SPA for everything else, falling back to
    # index.html for client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
