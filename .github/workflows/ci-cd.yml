name: PipelineShield CI/CD

on:
  push:
    branches:
      - "main"

  pull_request:
    branches:
      - "main"

permissions:
  contents: read

jobs:

  # ============================================================
  # BACKEND VALIDATION
  # ============================================================

  backend-validation:
    name: Backend - Application Validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: pipelineshield-api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install .
      - name: Verify application import
        run: |
          python -c "from pipelineshield.api.main import app; print('APP OK:', app.title)"
  # ============================================================
  # FRONTEND BUILD
  # ============================================================

  frontend-build:
    name: Frontend - Build Without Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: pipelineshield-web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check Node and npm versions
        run: |
          node --version
          npm --version
      - name: Generate package-lock.json
        run: |
          npm install --package-lock-only
          test -f package-lock.json
      - name: Install frontend dependencies
        run: |
          npm ci
      - name: Remove frontend test files
        shell: bash
        run: |
          echo "Frontend test files before removal:"
          find src -type f \( \
            -name "*.test.ts" \
            -o -name "*.test.tsx" \
            -o -name "*.spec.ts" \
            -o -name "*.spec.tsx" \
          \) -print || true
          echo "Removing frontend test files..."
          find src -type f \( \
            -name "*.test.ts" \
            -o -name "*.test.tsx" \
            -o -name "*.spec.ts" \
            -o -name "*.spec.tsx" \
          \) -delete
          echo "Frontend test files remaining:"
          find src -type f \( \
            -name "*.test.ts" \
            -o -name "*.test.tsx" \
            -o -name "*.spec.ts" \
            -o -name "*.spec.tsx" \
          \) -print || true
      - name: Build frontend
        run: |
          npm run build
  # ============================================================
  # DOCKER IMAGES
  # ============================================================

  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest

    needs:
      - backend-validation
      - frontend-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # Setup Node
      # ----------------------------------------------------------

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check Node and npm versions
        run: |
          node --version
          npm --version
      # ----------------------------------------------------------
      # Generate package-lock.json in Docker build workspace
      # ----------------------------------------------------------

      - name: Generate frontend package-lock.json
        working-directory: pipelineshield-web
        run: |
          echo "Generating package-lock.json..."
          npm install --package-lock-only
          test -f package-lock.json
          echo "package-lock.json is available."
      # ----------------------------------------------------------
      # Remove frontend tests BEFORE Docker build
      # ----------------------------------------------------------

      - name: Remove frontend test files before Docker build
        working-directory: pipelineshield-web
        shell: bash
        run: |
          echo "Frontend test files before removal:"
          find src -type f \( \
            -name "*.test.ts" \
            -o -name "*.test.tsx" \
            -o -name "*.spec.ts" \
            -o -name "*.spec.tsx" \
          \) -print || true
          echo "Removing frontend test files..."
          find src -type f \( \
            -name "*.test.ts" \
            -o -name "*.test.tsx" \
            -o -name "*.spec.ts" \
            -o -name "*.spec.tsx" \
          \) -delete
          echo "Frontend test files remaining:"
          find src -type f \( \
            -name "*.test.ts" \
            -o -name "*.test.tsx" \
            -o -name "*.spec.ts" \
            -o -name "*.spec.tsx" \
          \) -print || true
      # ----------------------------------------------------------
      # Build backend Docker image
      # ----------------------------------------------------------

      - name: Build backend image
        run: |
          docker build \
            -t pipelineshield-backend:${{ github.sha }} \
            ./pipelineshield-api
      # ----------------------------------------------------------
      # Build frontend Docker image
      # ----------------------------------------------------------

      - name: Build frontend image
        run: |
          docker build \
            -t pipelineshield-frontend:${{ github.sha }} \
            ./pipelineshield-web
      # ----------------------------------------------------------
      # Verify Docker images
      # ----------------------------------------------------------

      - name: Verify Docker images
        run: |
          docker images | grep pipelineshield
  # ============================================================
  # KUBERNETES VALIDATION
  # ============================================================
  #
  # NOTE ON FIX:
  # `kubectl apply --dry-run=client` still needs to talk to a
  # live API server to build its RESTMapper / discover resource
  # types and (when validate=true) fetch the OpenAPI schema.
  # There is no flag combination that makes it fully offline, so
  # in a job with no cluster it will always fail with a
  # "connection refused" style error, regardless of --validate.
  #
  # Fix: use kubeconform, a standalone Kubernetes manifest
  # validator that checks manifests against bundled/downloaded
  # OpenAPI schemas without needing any live cluster at all.
  # This job also no longer depends on build-images, since it
  # only needs the repo checkout to validate YAML manifests,
  # letting it run in parallel and speeding up the pipeline.
  # ============================================================

  validate-kubernetes:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest

    needs:
      - backend-validation
      - frontend-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -sSLo kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform.tar.gz
          chmod +x kubeconform
          sudo mv kubeconform /usr/local/bin/kubeconform
          kubeconform -v
      - name: Validate namespace manifest
        run: |
          kubeconform -strict -summary k8s/namespace.yaml
      - name: Validate backend manifest
        run: |
          kubeconform -strict -summary k8s/backend.yaml
      - name: Validate frontend manifest
        run: |
          kubeconform -strict -summary k8s/frontend.yaml
      - name: Validate postgres manifest
        run: |
          kubeconform -strict -summary k8s/postgres.yaml
      - name: Validate redis manifest
        run: |
          kubeconform -strict -summary k8s/redis.yaml
      - name: Kubernetes validation summary
        run: |
          echo "=========================================="
          echo "Kubernetes manifests validated successfully"
          echo "=========================================="
  # ============================================================
  # LOCAL KUBERNETES DEPLOYMENT USING KIND
  # ============================================================

  deploy-local:
    name: Deploy to Kind Kubernetes
    runs-on: ubuntu-latest
    timeout-minutes: 40

    needs:
      - validate-kubernetes
      - build-images

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # Setup Node
      # ----------------------------------------------------------

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # ----------------------------------------------------------
      # Generate package-lock.json
      # ----------------------------------------------------------

      - name: Generate frontend package-lock.json
        working-directory: pipelineshield-web
        run: |
          npm install --package-lock-only
          test -f package-lock.json
      # ----------------------------------------------------------
      # Remove frontend tests
      # ----------------------------------------------------------

      - name: Remove frontend test files
        working-directory: pipelineshield-web
        shell: bash
        run: |
          echo "Removing frontend test files..."
          find src -type f \( \
            -name "*.test.ts" \
            -o -name "*.test.tsx" \
            -o -name "*.spec.ts" \
            -o -name "*.spec.tsx" \
          \) -delete
          echo "Frontend test files removed."
      # ----------------------------------------------------------
      # Create Kind cluster
      # ----------------------------------------------------------

      - name: Create Kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: pipelineshield

      # ----------------------------------------------------------
      # Verify Kubernetes cluster
      # ----------------------------------------------------------

      - name: Verify Kind cluster
        run: |
          kubectl cluster-info
          kubectl get nodes
      # ----------------------------------------------------------
      # Build backend image
      # ----------------------------------------------------------

      - name: Build backend image
        run: |
          docker build \
            -t pipelineshield-backend:local \
            ./pipelineshield-api
      # ----------------------------------------------------------
      # Build frontend image
      # ----------------------------------------------------------

      - name: Build frontend image
        run: |
          docker build \
            -t pipelineshield-frontend:local \
            ./pipelineshield-web
      # ----------------------------------------------------------
      # Load backend image into Kind
      # ----------------------------------------------------------

      - name: Load backend image into Kind
        run: |
          kind load docker-image \
            pipelineshield-backend:local \
            --name pipelineshield
      # ----------------------------------------------------------
      # Load frontend image into Kind
      # ----------------------------------------------------------

      - name: Load frontend image into Kind
        run: |
          kind load docker-image \
            pipelineshield-frontend:local \
            --name pipelineshield
      # ----------------------------------------------------------
      # Deploy namespace
      # ----------------------------------------------------------

      - name: Deploy namespace
        run: |
          kubectl apply \
            -f k8s/namespace.yaml
      # ----------------------------------------------------------
      # Deploy postgres + redis
      # ----------------------------------------------------------
      #
      # The backend's routers all depend on a live database (see
      # pipelineshield/persistence/db.py + main.py's DATABASE_URL wiring)
      # and a Redis-backed session store. Without these, every DB-backed
      # route returns an unhandled 500 even though health-check routes
      # like /api/docs stay green. These must be up, migrated, and seeded
      # BEFORE the backend pod starts.
      # ----------------------------------------------------------

      - name: Deploy postgres and redis
        run: |
          kubectl apply -f k8s/postgres.yaml
          kubectl apply -f k8s/redis.yaml

      - name: Wait for postgres rollout
        run: |
          kubectl rollout status \
            deployment/pipelineshield-postgres \
            -n pipelineshield \
            --timeout=120s

      - name: Wait for redis rollout
        run: |
          kubectl rollout status \
            deployment/pipelineshield-redis \
            -n pipelineshield \
            --timeout=120s
      # ----------------------------------------------------------
      # Run database migrations
      # ----------------------------------------------------------
      #
      # Runs from the runner against a temporary port-forward, using the
      # same alembic/ migration chain that ships in the repo. Must happen
      # before the backend deployment or its first request after startup
      # seed will fail with "relation does not exist".
      # ----------------------------------------------------------

      - name: Setup Python for migrations
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend package for migrations
        working-directory: pipelineshield-api
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Port-forward postgres for migrations
        run: |
          kubectl port-forward \
            svc/pipelineshield-postgres \
            5432:5432 \
            -n pipelineshield \
            > /tmp/postgres-forward.log 2>&1 &
          sleep 10

      - name: Run alembic migrations
        working-directory: pipelineshield-api
        env:
          DATABASE_URL: "postgresql+psycopg://pipelineshield:pipelineshield@127.0.0.1:5432/pipelineshield"
        run: |
          alembic upgrade head
      # ----------------------------------------------------------
      # Deploy backend
      # ----------------------------------------------------------

      - name: Deploy backend
        run: |
          kubectl apply \
            -f k8s/backend.yaml
      # ----------------------------------------------------------
      # Deploy frontend
      # ----------------------------------------------------------

      - name: Deploy frontend
        run: |
          kubectl apply \
            -f k8s/frontend.yaml
      # ----------------------------------------------------------
      # Wait for backend
      # ----------------------------------------------------------

      - name: Wait for backend rollout
        run: |
          kubectl rollout status \
            deployment/pipelineshield-backend \
            -n pipelineshield \
            --timeout=180s
      # ----------------------------------------------------------
      # Wait for frontend
      # ----------------------------------------------------------

      - name: Wait for frontend rollout
        run: |
          kubectl rollout status \
            deployment/pipelineshield-frontend \
            -n pipelineshield \
            --timeout=180s
      # ----------------------------------------------------------
      # Create backend port forward
      # ----------------------------------------------------------

      - name: Create backend port forward
        run: |
          kubectl port-forward \
            svc/pipelineshield-backend \
            8000:8000 \
            -n pipelineshield \
            > /tmp/backend.log 2>&1 &
          sleep 10
      # ----------------------------------------------------------
      # Backend health check
      # ----------------------------------------------------------

      - name: Backend health check
        run: |
          curl --fail \
            --retry 10 \
            --retry-delay 3 \
            http://127.0.0.1:8000/api/docs
      # ----------------------------------------------------------
      # OpenAPI check
      # ----------------------------------------------------------

      - name: API OpenAPI check
        run: |
          curl --fail \
            http://127.0.0.1:8000/openapi.json
      # ----------------------------------------------------------
      # Functional smoke test — actually exercises the DB-backed path
      # ----------------------------------------------------------
      #
      # /api/docs and /openapi.json don't touch the database, so they
      # stayed green even when every real endpoint 500'd. This step
      # submits a real pipeline definition through the same endpoint the
      # frontend's upload screen calls, and fails the job on any non-2xx
      # response (401/403/404/500/etc).
      # ----------------------------------------------------------

      - name: Smoke test analysis endpoint
        run: |
          HTTP_STATUS=$(curl -s -o /tmp/analysis-response.json -w "%{http_code}" \
            --fail-with-body \
            -X POST http://127.0.0.1:8000/api/v1/analyses \
            -H "Content-Type: application/json" \
            -d '{"definition_text":"on:\n  push:\n    branches: [main]\njobs:\n  build:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n","filename":"smoke-test.yml"}') || {
            echo "Analysis endpoint returned HTTP $HTTP_STATUS"
            cat /tmp/analysis-response.json || true
            exit 1
          }
          echo "Analysis endpoint responded $HTTP_STATUS"
          cat /tmp/analysis-response.json
      # ----------------------------------------------------------
      # Create frontend port forward
      # ----------------------------------------------------------

      - name: Create frontend port forward
        run: |
          kubectl port-forward \
            svc/pipelineshield-frontend \
            8080:80 \
            -n pipelineshield \
            > /tmp/frontend.log 2>&1 &
          sleep 10
      # ----------------------------------------------------------
      # Frontend health check
      # ----------------------------------------------------------

      - name: Frontend health check
        run: |
          curl --fail \
            --retry 10 \
            --retry-delay 3 \
            http://127.0.0.1:8080
      # ----------------------------------------------------------
      # Install cloudflared
      # ----------------------------------------------------------
      #
      # cloudflared's "quick tunnel" mode requires no account,
      # token, or DNS setup - it opens a random, free, public
      # https://<random>.trycloudflare.com URL that proxies to
      # a localhost port on this runner. This is what makes the
      # app reachable online, since GitHub Pages cannot serve a
      # live backend/cluster (Pages is static-file hosting only).
      # ----------------------------------------------------------

      - name: Install cloudflared
        run: |
          curl -sSLo cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/cloudflared
          cloudflared --version
      # ----------------------------------------------------------
      # Start public tunnels
      # ----------------------------------------------------------

      - name: Start public tunnels
        run: |
          cloudflared tunnel --url http://127.0.0.1:8000 \
            > /tmp/backend-tunnel.log 2>&1 &
          cloudflared tunnel --url http://127.0.0.1:8080 \
            > /tmp/frontend-tunnel.log 2>&1 &
          echo "Waiting for tunnels to come up..."
          sleep 15
      # ----------------------------------------------------------
      # Print public URLs
      # ----------------------------------------------------------

      - name: Print public URLs
        run: |
          BACKEND_URL=$(grep -o 'https://[a-zA-Z0-9.-]*\.trycloudflare\.com' /tmp/backend-tunnel.log | head -n1)
          FRONTEND_URL=$(grep -o 'https://[a-zA-Z0-9.-]*\.trycloudflare\.com' /tmp/frontend-tunnel.log | head -n1)

          if [ -z "$BACKEND_URL" ] || [ -z "$FRONTEND_URL" ]; then
            echo "Tunnel URL not found yet, retrying..."
            sleep 15
            BACKEND_URL=$(grep -o 'https://[a-zA-Z0-9.-]*\.trycloudflare\.com' /tmp/backend-tunnel.log | head -n1)
            FRONTEND_URL=$(grep -o 'https://[a-zA-Z0-9.-]*\.trycloudflare\.com' /tmp/frontend-tunnel.log | head -n1)
          fi

          echo "=========================================="
          echo "APP IS LIVE - PUBLIC URLS"
          echo "=========================================="
          echo "Frontend:      $FRONTEND_URL"
          echo "Backend API:   $BACKEND_URL"
          echo "Swagger docs:  $BACKEND_URL/api/docs"
          echo "=========================================="
          echo "These URLs stay live for about 15 minutes,"
          echo "while this job is running."
          echo "=========================================="

          {
            echo "## 🚀 App is live for ~15 minutes"
            echo ""
            echo "| Service | URL |"
            echo "|---|---|"
            echo "| Frontend | $FRONTEND_URL |"
            echo "| Backend API | $BACKEND_URL |"
            echo "| Swagger docs | $BACKEND_URL/api/docs |"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "BACKEND_URL=$BACKEND_URL" >> "$GITHUB_ENV"
          echo "FRONTEND_URL=$FRONTEND_URL" >> "$GITHUB_ENV"
      # ----------------------------------------------------------
      # Deployment diagnostics
      # ----------------------------------------------------------

      - name: Deployment status
        if: always()
        run: |
          echo "=========================================="
          echo "PODS"
          echo "=========================================="
          kubectl get pods -n pipelineshield
          echo "=========================================="
          echo "SERVICES"
          echo "=========================================="
          kubectl get svc -n pipelineshield
          echo "=========================================="
          echo "DEPLOYMENTS"
          echo "=========================================="
          kubectl get deployments -n pipelineshield
          echo "=========================================="
          echo "BACKEND LOGS"
          echo "=========================================="
          kubectl logs \
            deployment/pipelineshield-backend \
            -n pipelineshield \
            --tail=100 || true
          echo "=========================================="
          echo "FRONTEND LOGS"
          echo "=========================================="
          kubectl logs \
            deployment/pipelineshield-frontend \
            -n pipelineshield \
            --tail=100 || true
          echo "=========================================="
          echo "POSTGRES LOGS"
          echo "=========================================="
          kubectl logs \
            deployment/pipelineshield-postgres \
            -n pipelineshield \
            --tail=50 || true
          echo "=========================================="
          echo "REDIS LOGS"
          echo "=========================================="
          kubectl logs \
            deployment/pipelineshield-redis \
            -n pipelineshield \
            --tail=50 || true
          echo "=========================================="
          echo "BACKEND API"
          echo "=========================================="
          echo "http://127.0.0.1:8000"
          echo "=========================================="
          echo "SWAGGER"
          echo "=========================================="
          echo "http://127.0.0.1:8000/api/docs"
      # ----------------------------------------------------------
      # Final public access URLs
      # ----------------------------------------------------------

      - name: Final public access URLs
        if: always()
        run: |
          echo "=========================================="
          echo "🚀 APP ACCESS URLS (via cloudflared tunnel)"
          echo "=========================================="
          echo "Frontend:      ${FRONTEND_URL:-not available}"
          echo "Backend API:   ${BACKEND_URL:-not available}"
          echo "Swagger docs:  ${BACKEND_URL:-not available}/api/docs"
          echo "OpenAPI spec:  ${BACKEND_URL:-not available}/openapi.json"
          echo "=========================================="
          echo "These URLs were live for ~15 minutes during"
          echo "this job run. Once the job ends, they stop working."
          echo "Check the Summary tab above for clickable links."
          echo "=========================================="

          {
            echo ""
            echo "## ✅ Final Access URLs"
            echo ""
            echo "| Service | URL |"
            echo "|---|---|"
            echo "| Frontend | ${FRONTEND_URL:-not available} |"
            echo "| Backend API | ${BACKEND_URL:-not available} |"
            echo "| Swagger docs | ${BACKEND_URL:-not available}/api/docs |"
            echo "| OpenAPI spec | ${BACKEND_URL:-not available}/openapi.json |"
          } >> "$GITHUB_STEP_SUMMARY"
      # ----------------------------------------------------------
      # Keep app alive for 15 minutes
      # ----------------------------------------------------------
      #
      # Placed last on purpose: diagnostics and the final URL
      # summary run immediately, then this step holds the job
      # (and therefore the kind cluster + cloudflared tunnels)
      # open for 15 minutes so the printed URLs stay clickable.
      # ----------------------------------------------------------

      - name: Keep app alive for 15 minutes
        run: |
          echo "=========================================="
          echo "App will stay live for 15 minutes."
          echo "Frontend:      ${FRONTEND_URL:-not available}"
          echo "Backend API:   ${BACKEND_URL:-not available}"
          echo "=========================================="
          for i in $(seq 15 -1 1); do
            echo "Time remaining: ${i} minute(s)..."
            sleep 60
          done
          echo "15 minutes elapsed. Shutting down."
